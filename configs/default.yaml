# Baseline configuration. Precise baseline = first value of every knob range in knobs.yaml.
seed: 42

models:
  generator:       Qwen/Qwen2.5-3B-Instruct     # Kaggle default; 7B reserved for 4090
  generator_small: Qwen/Qwen2.5-1.5B-Instruct
  embedder:        BAAI/bge-small-en-v1.5

dataset:
  name: hotpotqa/hotpot_qa
  config: distractor
  split: validation
  subset_size: 1000
  min_paragraphs: 10

retrieval:
  top_k: 5
  embed_dim: 384

generation:
  batch_size: 16          # measured: OOM at 48, OK at 40 (padded 1539 tok,
                          # peak 12.72 GiB). Set to ~2x margin below ceiling.
                          # FROZEN — batched greedy decode is not bitwise
                          # reproducible across batch sizes.
  max_new_tokens: 32
  max_new_tokens_explain: 256     # regime "explain": dev p99 = 198, 0% truncated
  padding_side: left

paths:
  results_dir: results/
  figures_dir: figures/
  index_dir:   results/indexes/
